aid: mirus
name: MiRus
description: >-
  MiRus is a Marietta, Georgia life sciences company founded in 2015 that develops and
  commercializes implants and procedural solutions built on MoRe, its proprietary
  molybdenum-rhenium superalloy, for spine, orthopaedic and structural heart disease. Its
  FDA-cleared portfolio spans the Europa pedicle screw system, CYGNUS MoRe anterior cervical
  plating, 3DR printed interbody and corpectomy systems, the Atlas foot-and-ankle plating line,
  and the Siegel transcatheter aortic valve, alongside GALILEO — a spine-focused surgical
  planning, intra-operative alignment measurement and remote physiologic monitoring platform
  delivered to clinicians as the "Mirus Analytics" web application at rpm.mirusmed.com. MiRus
  publishes no public developer program: the GALILEO backend, which includes a FHIR route, is
  bearer/Cognito authenticated and answers 401 on every path, and no OpenAPI, SDK, reference or
  developer portal is published anywhere on its public surface.
